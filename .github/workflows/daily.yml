name: Daily Card Generation & Auto-Update

on:
  schedule:
    # 06:00 UTC = ~08:00 AM Cairo time
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'daily-generate'
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Generate Daily Cards (Gemini & Groq fallback)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python scripts/generate_daily.py

      - name: Commit & Push New Cards and Index
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add cards/ data/
          if ! git diff --cached --quiet; then
            git commit -m "Auto-generate 15 daily cards (3x5 patches) for $(date -u +'%Y-%m-%d') [skip ci]"
            if ! git push origin HEAD:main; then
              git fetch origin main
              git rebase -X ours origin/main || (git checkout --theirs data/ && python scripts/build_index.py && git add data/ && GIT_EDITOR=true git rebase --continue)
              git push origin HEAD:main
            fi
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
